[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-economics-lab"
dynamic = ["version"]
description = "Paired cost-quality frontiers and economic assurance for AI-agent deployment decisions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Vyoma Gajjar"}]
keywords = ["ai-agents", "finops", "evaluation", "llm", "observability", "non-inferiority", "paired-experiment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.4", "coverage==7.6.10"]

[project.urls]
Homepage = "https://github.com/Vyoma/agent-economics-lab"
Repository = "https://github.com/Vyoma/agent-economics-lab"
Documentation = "https://github.com/Vyoma/agent-economics-lab/blob/main/docs/frontier.md"
Issues = "https://github.com/Vyoma/agent-economics-lab/issues"

[project.scripts]
agent-economics = "agent_economics.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agent_economics.__version__"}

[tool.setuptools.packages.find]
include = ["agent_economics*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: the terminal reports deliberately use ×, −, ∈ and block-drawing
# characters. RUF005: concatenation is clearer than unpacking at these sites.
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
# These modules render fixed-width terminal reports and section rules. Their
# aligned columns and box-drawing dividers are the output format, so a column
# limit fights the purpose rather than improving readability. Every other file
# is held to the 100-column limit.
"agent_economics/frontier_report.py" = ["E501"]
"agent_economics/kimi_analyst.py" = ["E501"]
"agent_economics/kimi_judge.py" = ["E501"]
"mutation_score.py" = ["E501"]
"real_trace_verdict.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_economics"]
# Without this, isort splits every `SOURCE_ID as CLAUDE_CODE_SOURCE_ID` alias
# into its own `from .claude_code import (...)` statement.
combine-as-imports = true
