name: test

on:
  push:
  pull_request:
  # Lets a maintainer re-run the full matrix against any ref on demand, without
  # pushing a commit to do it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Full history, not the default shallow clone. `make green-defects`
      # checks out the commit before each catalogued defect's fix and runs the
      # suite there, so the history IS the evidence. Freezing its results to a
      # committed file would make the one artifact whose point is independent
      # re-derivation unverifiable.
      #
      # This exact failure -- a generator walking git history at verification
      # time, fine on a full local clone, broken on every shallow CI checkout
      # -- already cost this repository five red commits and is recorded in
      # docs/novelty.md. It recurred because the lesson was written as a story
      # and never as a rule.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: make reproduce

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheels
      - run: python -m venv /tmp/agent-economics-venv
      - run: /tmp/agent-economics-venv/bin/pip install /tmp/wheels/agent_economics_lab-*.whl
      - run: /tmp/agent-economics-venv/bin/agent-economics capabilities
        working-directory: /tmp
      - name: Evaluate a real bundle through the installed wheel
        working-directory: /tmp
        env:
          BUNDLE: ${{ github.workspace }}/examples/claude-code/bundle.json
          EXPECTED_REPORT: ${{ github.workspace }}/examples/claude-code/assurance-case.md
        run: |
          set +e
          /tmp/agent-economics-venv/bin/agent-economics evaluate \
            --bundle "$BUNDLE" \
            --ci \
            --output /tmp/installed-wheel-assurance-case.md
          exit_code=$?
          set -e
          test "$exit_code" = "3"
          cmp /tmp/installed-wheel-assurance-case.md "$EXPECTED_REPORT"

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the public SWE-bench bundle
        if: ${{ matrix.python-version == '3.12' }}
        run: >-
          PYTHONPATH=. python
          examples/public-swebench/build_case.py
          --source examples/public-swebench/runs.json
          --output-dir /tmp/agent-economics-public-swebench

      - name: Dogfood CSV mode
        id: csv
        continue-on-error: true
        uses: ./
        with:
          traces: examples/support_trace.csv
          outcomes: examples/outcomes.csv
          rates: examples/rates.json
          baseline: examples/baseline.json
          policy: examples/policy.json
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify CSV mode preserves ASSIST
        if: always()
        env:
          OUTCOME: ${{ steps.csv.outcome }}
          DECISION: ${{ steps.csv.outputs.decision }}
          EXIT_CODE: ${{ steps.csv.outputs.exit-code }}
          REPORT: ${{ steps.csv.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$DECISION" = "ASSIST"
          test "$EXIT_CODE" = "3"
          grep -F "**Decision: ASSIST**" "$REPORT"

      - name: Dogfood Claude Code conversion mode
        if: ${{ matrix.python-version == '3.12' }}
        id: claude
        continue-on-error: true
        uses: ./
        with:
          adapter: claude-code
          session: examples/claude-code/session.jsonl
          contract: examples/claude-code/conversion-contract.json
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify conversion mode preserves ASSIST
        if: ${{ always() && matrix.python-version == '3.12' }}
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          DECISION: ${{ steps.claude.outputs.decision }}
          EXIT_CODE: ${{ steps.claude.outputs.exit-code }}
          REPORT: ${{ steps.claude.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$DECISION" = "ASSIST"
          test "$EXIT_CODE" = "3"
          cmp "$REPORT" examples/claude-code/assurance-case.md

      - name: Dogfood Claude Code session-tree conversion mode
        if: ${{ matrix.python-version == '3.12' }}
        id: claude_tree
        uses: ./
        with:
          adapter: claude-code-tree
          session: examples/claude-code-tree/session.jsonl
          contract: examples/claude-code-tree/conversion-contract.json
          attestations: examples/attestations.json
          as-of: "2026-09-01"
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify session-tree conversion preserves SCALE
        if: ${{ always() && matrix.python-version == '3.12' }}
        env:
          OUTCOME: ${{ steps.claude_tree.outcome }}
          DECISION: ${{ steps.claude_tree.outputs.decision }}
          EXIT_CODE: ${{ steps.claude_tree.outputs.exit-code }}
          REPORT: ${{ steps.claude_tree.outputs.report }}
        run: |
          test "$OUTCOME" = "success"
          test "$DECISION" = "SCALE"
          test "$EXIT_CODE" = "0"
          cmp "$REPORT" examples/claude-code-tree/assurance-case.md

      - name: Dogfood OpenTelemetry conversion mode
        id: otel
        uses: ./
        with:
          adapter: otel-genai
          session: examples/otel-genai/langfuse-otlp.json
          contract: examples/otel-genai/langfuse-conversion-contract.json
          attestations: examples/attestations.json
          as-of: "2026-09-01"
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify OpenTelemetry conversion preserves SCALE
        if: always()
        env:
          OUTCOME: ${{ steps.otel.outcome }}
          DECISION: ${{ steps.otel.outputs.decision }}
          EXIT_CODE: ${{ steps.otel.outputs.exit-code }}
          REPORT: ${{ steps.otel.outputs.report }}
        run: |
          test "$OUTCOME" = "success"
          test "$DECISION" = "SCALE"
          test "$EXIT_CODE" = "0"
          grep -F "**Decision: SCALE**" "$REPORT"

      - name: Build a bundle that can go green
        if: ${{ matrix.python-version == '3.12' }}
        # The frontier arm this step used to evaluate records no outcome
        # instrument, which is INCOMPLETE by design now that a SCALE must
        # survive the audit. Bundle mode is exercised on evidence that names
        # its instrument and ships a calibration record for it.
        run: >-
          PYTHONPATH=. python -m agent_economics convert
          --from claude-code-tree
          --in examples/claude-code-tree/session.jsonl
          --contract examples/claude-code-tree/conversion-contract.json
          --out /tmp/agent-economics-green-bundle.json

      - name: Dogfood SCALE pass path
        if: ${{ matrix.python-version == '3.12' }}
        id: scale
        uses: ./
        with:
          bundle: /tmp/agent-economics-green-bundle.json
          attestations: examples/attestations.json
          as-of: "2026-09-01"
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify SCALE is the only green path
        if: ${{ always() && matrix.python-version == '3.12' }}
        env:
          OUTCOME: ${{ steps.scale.outcome }}
          DECISION: ${{ steps.scale.outputs.decision }}
          EXIT_CODE: ${{ steps.scale.outputs.exit-code }}
          REPORT: ${{ steps.scale.outputs.report }}
        run: |
          test "$OUTCOME" = "success"
          test "$DECISION" = "SCALE"
          test "$EXIT_CODE" = "0"
          grep -F "**Decision: SCALE**" "$REPORT"

      - name: Dogfood normalized bundle mode
        if: ${{ matrix.python-version == '3.12' }}
        id: public
        continue-on-error: true
        uses: ./
        with:
          bundle: /tmp/agent-economics-public-swebench/arms/candidate-opus.json
          python-version: ${{ matrix.python-version }}
          comment: "false"

      - name: Verify public case preserves STOP
        if: ${{ always() && matrix.python-version == '3.12' }}
        env:
          OUTCOME: ${{ steps.public.outcome }}
          DECISION: ${{ steps.public.outputs.decision }}
          EXIT_CODE: ${{ steps.public.outputs.exit-code }}
          REPORT: ${{ steps.public.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$DECISION" = "STOP"
          test "$EXIT_CODE" = "4"
          cmp "$REPORT" examples/public-swebench/assurance-case.md
