name: Agent Economics Gate
description: Fail closed unless an AI-agent workload has a complete SCALE assurance decision
author: Vyoma Gajjar

branding:
  icon: shield
  color: purple

inputs:
  bundle:
    description: Path to one normalized Agent Economics JSON bundle
    required: false
    default: ""
  claim:
    description: >-
      Path to a published claim to check against `bundle`. When set, the action
      verifies the claim instead of issuing a fresh decision: it recomputes the
      evidence digest from contents, rebinds every check by identity and by the
      source text that implemented it, recomputes the decision contract, and
      re-runs the engine. Only SUPPORTED passes. REFUTED means the evidence
      contradicts the claim. UNVERIFIED means this build cannot reproduce it,
      which is not the same as the claim being false, and the verdict names the
      revision it was issued against so you can check it there.
    required: false
    default: ""
  traces:
    description: Path to the trace CSV for CSV input mode
    required: false
    default: ""
  outcomes:
    description: Path to the outcome CSV for CSV input mode
    required: false
    default: ""
  rates:
    description: Path to the model rate-card JSON for CSV input mode
    required: false
    default: ""
  baseline:
    description: Path to the named baseline JSON for CSV input mode
    required: false
    default: ""
  policy:
    description: Path to the economic policy JSON for CSV input mode
    required: false
    default: ""
  adapter:
    description: Source adapter name, claude-code, claude-code-tree, or otel-genai
    required: false
    default: ""
  session:
    description: Path to the offline source session for conversion mode
    required: false
    default: ""
  contract:
    description: Path to the completed conversion contract for conversion mode
    required: false
    default: ""
  python-version:
    description: Python version used to run the action
    required: false
    default: "3.12"
  comment:
    description: Upsert the Markdown report on pull requests when a token is supplied
    required: false
    default: "true"
  github-token:
    description: GitHub token used only to create or update the pull request comment
    required: false
    default: ""

outputs:
  decision:
    description: SCALE, INCOMPLETE, ASSIST, or STOP
    value: ${{ steps.evaluate.outputs.decision }}
  exit-code:
    description: Decision exit code, where only 0 means SCALE
    value: ${{ steps.evaluate.outputs.exit-code }}
  report:
    description: Absolute path to the generated Markdown assurance report
    value: ${{ steps.evaluate.outputs.report }}
  verdict:
    description: SUPPORTED, REFUTED, or UNVERIFIED when `claim` was supplied
    value: ${{ steps.verify.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Agent Economics Lab
      shell: bash
      env:
        AGENT_ECONOMICS_ACTION_PATH: ${{ github.action_path }}
      run: >-
        python -m pip install
        --disable-pip-version-check
        --no-deps
        "$AGENT_ECONOMICS_ACTION_PATH"

    - name: Verify a published claim
      id: verify
      if: ${{ inputs.claim != '' }}
      shell: bash
      env:
        INPUT_CLAIM: ${{ inputs.claim }}
        INPUT_BUNDLE: ${{ inputs.bundle }}
      run: |
        set +e
        python -m agent_economics verify \
          --claim "$INPUT_CLAIM" --bundle "$INPUT_BUNDLE" | tee "$RUNNER_TEMP/verification.md"
        code=${PIPESTATUS[0]}
        case "$code" in
          0) verdict=SUPPORTED ;;
          4) verdict=REFUTED ;;
          *) verdict=UNVERIFIED ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        if [ "$code" != "0" ]; then
          echo "::error::claim verification returned $verdict" >&2
          exit "$code"
        fi

    - name: Evaluate economic assurance
      id: evaluate
      if: ${{ inputs.claim == '' }}
      shell: bash
      env:
        INPUT_BUNDLE: ${{ inputs.bundle }}
        INPUT_TRACES: ${{ inputs.traces }}
        INPUT_OUTCOMES: ${{ inputs.outcomes }}
        INPUT_RATES: ${{ inputs.rates }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_ADAPTER: ${{ inputs.adapter }}
        INPUT_SESSION: ${{ inputs.session }}
        INPUT_CONTRACT: ${{ inputs.contract }}
      run: |
        python -m agent_economics.github_action \
          --bundle "$INPUT_BUNDLE" \
          --traces "$INPUT_TRACES" \
          --outcomes "$INPUT_OUTCOMES" \
          --rates "$INPUT_RATES" \
          --baseline "$INPUT_BASELINE" \
          --policy "$INPUT_POLICY" \
          --adapter "$INPUT_ADAPTER" \
          --session "$INPUT_SESSION" \
          --contract "$INPUT_CONTRACT" \
          --report-dir "$RUNNER_TEMP"

    - name: Upsert pull request report
      if: ${{ inputs.claim == '' && inputs.comment == 'true' && inputs.github-token != '' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      env:
        REPORT_PATH: ${{ steps.evaluate.outputs.report }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- agent-economics-lab-report -->";
          const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
          const body = `${marker}\n${report}`;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            }
          );
          const existing = comments.find(
            comment =>
              comment.user?.type === "Bot" &&
              comment.body?.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }

    # Guarded on the mode that produces the exit code it reads. Unguarded, a
    # claim-mode run reached this step with AGENT_ECONOMICS_EXIT_CODE unset
    # from the skipped evaluate step and ran `exit ""`. bash rejects that with
    # "numeric argument required" and exits 255, so it failed closed rather
    # than open -- but 255 is not one of this action's documented codes and
    # tells a reader nothing about why. Verified, because the first version of
    # this comment asserted it exited 0 without checking.
    - name: Enforce SCALE-only policy
      if: ${{ inputs.claim == '' }}
      shell: bash
      env:
        AGENT_ECONOMICS_EXIT_CODE: ${{ steps.evaluate.outputs.exit-code }}
      run: exit "$AGENT_ECONOMICS_EXIT_CODE"
